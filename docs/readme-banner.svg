<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Needly: Less noise. More focus.</title>
  <desc id="description">Scattered GitHub events flow through a blue needle-inspired focus mark into three clear actions: Review, Fix, and Merge. Needly organizes the work; you make the decisions.</desc>
