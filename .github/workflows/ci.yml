name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Needly.sln

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build Needly.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Needly.sln --no-build --no-restore --configuration Release

      - name: Verify EF model and migrations agree
        run: >
          dotnet ef migrations has-pending-model-changes
          --project Needly.Infrastructure/Needly.Infrastructure.csproj
          --startup-project Needly.Infrastructure/Needly.Infrastructure.csproj
          --configuration Release --no-build
