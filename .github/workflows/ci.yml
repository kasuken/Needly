name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Needly.sln

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build Needly.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Needly.sln --no-build --no-restore --configuration Release

      - name: Verify EF model and migrations agree
        run: >
          dotnet ef migrations has-pending-model-changes
          --project Needly.Infrastructure/Needly.Infrastructure.csproj
          --startup-project Needly.Infrastructure/Needly.Infrastructure.csproj
          --configuration Release --no-build
